# =============================================================
# Stack da VPS — Evolution API (WhatsApp) + Postgres + Redis.
#
# PONTO CRÍTICO: a sessão do WhatsApp (o pareamento do QR Code) vive nos
# VOLUMES abaixo. Enquanto os volumes existirem, subir/descer/atualizar os
# containers NÃO pede QR de novo. Só um `docker compose down -v` (com -v!)
# apaga os volumes e força reler o QR — por isso o deploy.sh nunca usa -v.
#
# O "cérebro" do agente NÃO está aqui: ele roda na Vercel (Next.js) e é
# atualizado por git push, sem tocar nesta VPS. Esta stack só mantém a
# conexão do WhatsApp viva e entrega os webhooks para a Vercel.
# =============================================================

services:
  # TLS + domínio fixo. O Caddy obtém e renova o certificado Let's Encrypt
  # sozinho — basta o DNS de EVOLUTION_DOMINIO já apontar para esta máquina
  # antes de subir, senão a emissão falha.
  caddy:
    image: caddy:2-alpine
    container_name: evolution_caddy
    restart: always
    ports:
      - '80:80'
      - '443:443'
    environment:
      EVOLUTION_DOMINIO: ${EVOLUTION_DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # <- certificados; preserva entre deploys
      - caddy_config:/config
    depends_on:
      - evolution-api

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7 # fixe a versão; não use :latest em produção
    # Nota: a imagem antiga (atendai/evolution-api) foi descontinuada no Docker
    # Hub (pull access denied) — o projeto migrou para o org evoapicloud.
    container_name: evolution_api
    restart: always
    ports:
      # Só no loopback: quem publica para a internet é o Caddy, com TLS.
      # Expor '8080:8080' numa VPS deixaria a API acessível em HTTP puro,
      # protegida apenas pela API key e com o tráfego em texto claro.
      - '127.0.0.1:8080:8080'
    environment:
      # --- servidor ---
      SERVER_URL: ${SERVER_URL} # ex.: https://evo.suaclinica.com.br
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      # --- persistência da sessão no Postgres (sobrevive a restart) ---
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
      DATABASE_SAVE_MESSAGE_UPDATE: 'false'
      DATABASE_SAVE_DATA_CONTACTS: 'false'
      DATABASE_SAVE_DATA_CHATS: 'false'
      # --- cache no Redis ---
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: 'false'
      # --- webhook: aponta para o app na Vercel ---
      WEBHOOK_GLOBAL_ENABLED: 'true'
      WEBHOOK_GLOBAL_URL: ${WEBHOOK_URL} # ex.: https://SEU-APP.vercel.app/api/whatsapp/evolution/webhook
      WEBHOOK_EVENTS_MESSAGES_UPSERT: 'true'
    volumes:
      - evolution_instances:/evolution/instances # <- sessão do WhatsApp
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: evolution_postgres
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data # <- histórico de instâncias

  redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: always
    volumes:
      - redis_data:/data

# Estes volumes NOMEADOS são o que preserva o pareamento do WhatsApp entre
# deploys. NUNCA rode `docker compose down -v` em produção.
volumes:
  evolution_instances:
  postgres_data:
  redis_data:
  caddy_data: # certificados TLS — apagar força reemissão e pode bater no rate limit do Let's Encrypt
  caddy_config:
